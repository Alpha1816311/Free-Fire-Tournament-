      // Guard window.fetch against browser extensions/interceptors that attempt
      // direct property assignment when window.fetch only has a getter
      (function() {
        try {
          var _origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          // fallback gracefully if property cannot be redefined
        }
      })();
